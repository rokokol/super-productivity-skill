name: ci

# Nothing here talks to a mirror, a :latest image or a live site, so it is a gate
# rather than a detector and pull requests run the whole of it
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: the ref to check out, so a bot can verify a branch with this very workflow
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: cachix/install-nix-action@v31
      - name: CI tools come from the lock, not the registry
        run: |
          if grep -rEn 'nix (run|shell) nixpkgs#|npx +[a-z@.-]|pip +install |go +install .*@latest' .github/workflows; then
            echo "unpinned registry lookup in a workflow — pin the tool in the flake's dev shell and use nix develop" >&2
            exit 1
          fi
      - name: tests/check.sh (self-testing gate)
        run: nix develop --no-write-lock-file -c ./tests/check.sh

  # A platform job, and so a gate: what turns it red is nearly always the change itself —
  # a GNU-only date flag, a construct bash 3.2 rejects — and the versions printed first
  # name the rare red an image update causes. bash and date are the system's own; jq comes
  # from the image, which the ci skill allows because sp.sh declares it as a dependency
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: the platform this job stands for
        run: |
          /bin/bash --version | head -n 1
          ls -l "$(command -v date)"
          if date --version >/dev/null 2>&1; then echo "date is GNU here, so this job proves nothing about macOS" >&2; exit 1; fi
          jq --version
      - name: the behaviour half under the bash and date macOS ships
        run: /bin/bash ./tests/check.sh behaviour
